  <line x1="400" y1="178" x2="400" y2="213" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="200" fill="#64748b" font-size="9">model.pkl + encoder.pkl</text>

  <rect x="30" y="216" width="200" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
