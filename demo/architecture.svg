  <text x="400" y="62" text-anchor="middle" fill="#8b949e" font-size="10">scikit-learn</text>

  <line x1="400" y1="80" x2="400" y2="115" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
