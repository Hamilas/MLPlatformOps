  <text x="260" y="232" text-anchor="middle" fill="#64748b" font-size="9">POST /predict</text>

  <rect x="290" y="216" width="220" height="60" rx="8" fill="#161b22" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="400" y="240" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="700">FastAPI Service</text>
  <text x="400" y="258" text-anchor="middle" fill="#8b949e" font-size="10">Docker, gunicorn</text>

